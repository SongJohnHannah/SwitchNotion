<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'"><title>AI 建库向导</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><span class="eyebrow">NOTIONSWITCH</span><h1>用 AI 创建数据库</h1><p>描述用途，预览字段，再选择布局并创建。</p><p id="workspaceLabel"></p></header><nav aria-label="创建步骤"><span id="step1" class="current">1 描述需求</span><span id="step2">2 预览字段</span><span id="step3">3 选择布局</span></nav>
<section id="describe"><label for="prompt">你想创建什么？</label><textarea id="prompt" rows="4" placeholder="例如：客户反馈库，包含优先级、处理状态、负责人和截止日期"></textarea><label for="parent">放在哪里？</label><input id="parent" placeholder="留空：当前工作区的私人新页面；也可粘贴父页面链接"><div class="actions"><button id="generate" class="primary">生成预览</button></div></section>
<section id="preview" hidden><h2 id="title"></h2><div id="fields"></div><label for="refine">调整字段或补充要求</label><textarea id="refine" rows="2" placeholder="例如：增加来源和截止日期，把优先级改为高、中、低"></textarea><div class="actions"><button id="regenerate">调整预览</button><button id="continue" class="primary">继续选择布局</button></div></section>
<section id="layouts" hidden><h2>选择你需要的视图</h2><div id="layoutChoices" class="grid"></div><div id="bindings"></div><p id="summary"></p><div class="actions"><button id="back">返回字段预览</button><button id="done" class="primary">完成并创建</button></div></section>
<section id="result" hidden><h2>创建完成</h2><p id="resultTitle"></p><button id="openResult" class="primary">打开数据库</button></section><p id="message" role="status" aria-live="polite"></p><button id="verifyResult" hidden>核对创建结果（不重复提交）</button><details><summary>最近的方案</summary><div id="recent"></div></details></main><script src="app.js"></script></body></html>
